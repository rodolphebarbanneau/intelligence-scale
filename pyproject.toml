[project]
name = "intelligence-scale"
version = "0.1.0"
description = "Rate AI products against the Intelligence Scale and the Execution Scale from their specs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-ai-slim[openrouter]>=2.51.0",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
]

[project.scripts]
intelligence-scale = "cli.main:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cli"
module-root = ""
